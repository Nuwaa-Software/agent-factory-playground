[project]
name = "expenses"
version = "0.1.0"
description = "Tiny expense tracker used as a playground for the Agent Factory AI employees."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expenses"]

[tool.pytest.ini_options]
testpaths = ["tests"]
